
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still You, Always You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    height: 100vh;
    background: radial-gradient(circle at center, #42162f, #100713 80%);
    font-family: Georgia, serif;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* Background stars */

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .2; transform: scale(.7); }
    to { opacity: 1; transform: scale(1.5); }
}

/* Initial heart */

.big-heart {
    position: absolute;
    top: 34%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 110px;
    z-index: 3;
    filter: drop-shadow(0 0 25px #ff174f);
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: translate(-50%,-50%) scale(1);
    }
    50% {
        transform: translate(-50%,-50%) scale(1.15);
    }
}

/* Bow */

.bow {
    position: absolute;
    left: 5%;
    bottom: 7%;
    width: 115px;
    height: 200px;
    z-index: 5;
    filter: drop-shadow(0 0 8px #e6a85c);
}

.bow svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* Arrow */

.arrow {
    position: absolute;
    left: 12%;
    top: 76%;
    width: 115px;
    height: 4px;
    background: linear-gradient(to right, #bd8b4c, #ffe0a0);
    border-radius: 5px;
    transform: rotate(-40deg);
    transform-origin: left center;
    z-index: 6;
    opacity: 0;
}

.arrow::before {
    content: "";
    position: absolute;
    right: -15px;
    top: -6px;
    border-left: 19px solid #e8c078;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
}

.arrow::after {
    content: "";
    position: absolute;
    left: 0;
    top: -6px;
    width: 18px;
    height: 15px;
    background: #ffcf83;
    clip-path: polygon(0 0, 100% 50%, 0 100%);
}

.arrow.fly {
    opacity: 1;
    animation: shoot 1.5s cubic-bezier(.25,.7,.3,1) forwards;
}

@keyframes shoot {
    0% {
        left: 12%;
        top: 76%;
        transform: rotate(-40deg);
    }
    100% {
        left: calc(50% - 40px);
        top: calc(34% + 12px);
        transform: rotate(-40deg);
    }
}

/* Bow string release */

.bow.shoot-bow {
    animation: bowRelease .3s ease;
}

@keyframes bowRelease {
    0% { transform: scaleX(1); }
    50% { transform: scaleX(.88); }
    100% { transform: scaleX(1); }
}

/* Heart explosion particles */

.particle {
    position: absolute;
    top: 34%;
    left: 50%;
    font-size: 23px;
    pointer-events: none;
    z-index: 8;
    animation: explode 1.4s ease-out forwards;
}

@keyframes explode {
    from {
        transform: translate(-50%,-50%) scale(1);
        opacity: 1;
    }
    to {
        transform: translate(var(--x),var(--y)) scale(0);
        opacity: 0;
    }
}

/* Message */

.message {
    position: absolute;
    top: 35%;
    left: 50%;
    width: 100%;
    padding: 0 10px;
    text-align: center;
    font-size: clamp(27px, 6vw, 65px);
    font-weight: bold;
    color: #ffb6d5;
    text-shadow: 0 0 15px #ff287d, 0 0 35px #ff287d;
    opacity: 0;
    transform: translate(-50%,-50%) scale(0);
    z-index: 9;
}

.message.show {
    animation: messageBlast 2s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes messageBlast {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(0);
    }
    60% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.2);
    }
    100% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1);
    }
}

/* Tree */

.tree-container {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 76%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    opacity: 0;
    z-index: 2;
}

.tree-container.show {
    animation: treeAppear 2s ease forwards;
}

@keyframes treeAppear {
    to { opacity: 1; }
}

.tree-container svg {
    width: min(90vw, 650px);
    height: 100%;
    overflow: visible;
}

.branch {
    fill: none;
    stroke: #bd8060;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;
}

.branch.draw {
    animation: grow 4s ease forwards;
}

@keyframes grow {
    to { stroke-dashoffset: 0; }
}

/* Heart-shaped leaves */

.leaf {
    position: absolute;
    font-size: 18px;
    opacity: 0;
    transform: scale(0);
    filter: drop-shadow(0 0 5px #ff427b);
    animation: leafGrow .7s ease forwards;
}

@keyframes leafGrow {
    0% {
        opacity: 0;
        transform: scale(0) rotate(-40deg);
    }
    70% {
        opacity: 1;
        transform: scale(1.3) rotate(10deg);
    }
    100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }
}

/* Ground glow */

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 10px;
    background: #ff6b9e;
    box-shadow: 0 0 30px 10px #ff347a;
    opacity: 0;
}

.ground.show {
    animation: glow 2s ease forwards;
}

@keyframes glow {
    to { opacity: .8; }
}

/* Floating hearts */

.floating {
    position: absolute;
    bottom: -30px;
    color: #ff6a9b;
    animation: floatUp linear infinite;
    pointer-events: none;
    z-index: 1;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Restart button */

.restart {
    position: absolute;
    bottom: 25px;
    right: 25px;
    padding: 11px 22px;
    background: rgba(255, 80, 140, .2);
    color: white;
    border: 1px solid #ff83b4;
    border-radius: 25px;
    cursor: pointer;
    z-index: 20;
    font-size: 14px;
}

.restart:hover {
    background: #e83c7c;
}

</style>
</head>

<body>

<div class="scene" id="scene">

    <!-- Big Heart -->
    <div class="big-heart" id="heart">❤️</div>

    <!-- Bow -->
    <div class="bow" id="bow">
        <svg viewBox="0 0 120 220">
            <path d="M85 10 Q-10 110 85 210"
                  fill="none"
                  stroke="#d6a15c"
                  stroke-width="9"
                  stroke-linecap="round"/>

            <path d="M85 10 L85 210"
                  fill="none"
                  stroke="#f5e5cf"
                  stroke-width="2"/>
        </svg>
    </div>

    <!-- Arrow -->
    <div class="arrow" id="arrow"></div>

    <!-- Message -->
    <div class="message" id="message">
        Still You, Always You ❤️
    </div>

    <!-- Tree -->
    <div class="tree-container" id="treeContainer">

        <svg viewBox="0 0 600 650">

            <path class="branch" id="branches"
            d="
            M300 650
            C290 560 310 490 300 400
            C290 330 250 280 180 230
            M300 400
            C340 320 400 280 460 220
            M300 470
            C230 420 170 390 120 330
            M300 350
            C350 290 350 220 340 150
            M300 400
            C260 330 250 260 250 180
            M180 230
            C160 180 130 150 90 140
            M460 220
            C480 170 510 150 540 130
            M120 330
            C100 290 80 260 50 240
            M340 150
            C380 110 420 90 450 80
            M250 180
            C220 130 190 110 160 90
            M300 400
            C370 410 430 390 490 340
            "/>

        </svg>

    </div>

    <div class="ground" id="ground"></div>

    <button class="restart" onclick="restartAnimation()">
        ↻ Replay
    </button>

</div>

<script>

const scene = document.getElementById("scene");
const heart = document.getElementById("heart");
const arrow = document.getElementById("arrow");
const bow = document.getElementById("bow");
const message = document.getElementById("message");
const treeContainer = document.getElementById("treeContainer");
const branches = document.getElementById("branches");
const ground = document.getElementById("ground");

let timers = [];

/* Background stars */

function createStars() {
    document.querySelectorAll(".star").forEach(s => s.remove());

    for (let i = 0; i < 90; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.animationDelay = Math.random() * 3 + "s";
        scene.appendChild(star);
    }
}

/* Floating hearts */

function floatingHeart() {
    const h = document.createElement("div");
    h.className = "floating";
    h.innerHTML = Math.random() > .5 ? "♥" : "♡";
    h.style.left = Math.random() * 100 + "%";
    h.style.fontSize = (12 + Math.random() * 20) + "px";
    h.style.animationDuration = (5 + Math.random() * 7) + "s";

    scene.appendChild(h);

    setTimeout(() => h.remove(), 12000);
}

let floatingInterval;

function startFloating() {
    clearInterval(floatingInterval);
    floatingInterval = setInterval(floatingHeart, 450);
}

/* Heart explosion */

function explodeHeart() {

    heart.style.animation = "none";
    heart.style.opacity = "0";

    for (let i = 0; i < 55; i++) {

        const p = document.createElement("div");
        p.className = "particle";
        p.innerHTML = ["❤️", "💗", "💕", "💖"][Math.floor(Math.random() * 4)];

        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 190;

        p.style.setProperty("--x", Math.cos(angle) * distance + "px");
        p.style.setProperty("--y", Math.sin(angle) * distance + "px");

        scene.appendChild(p);

        setTimeout(() => p.remove(), 1500);
    }
}

/* Grow tree leaves */

function growLeaves() {

    const bounds = treeContainer.getBoundingClientRect();

    const centerX = bounds.width / 2;
    const centerY = bounds.height * .40;

    const radiusX = Math.min(bounds.width * .37, 240);
    const radiusY = bounds.height * .34;

    for (let i = 0; i < 220; i++) {

        const angle = Math.random() * Math.PI * 2;
        const radius = Math.sqrt(Math.random());

        const x = centerX + Math.cos(angle) * radiusX * radius;
        const y = centerY + Math.sin(angle) * radiusY * radius;

        const leaf = document.createElement("div");

        leaf.className = "leaf";
        leaf.innerHTML = ["❤️", "💗", "💖", "💕"][Math.floor(Math.random() * 4)];

        leaf.style.left = x + "px";
        leaf.style.top = y + "px";
        leaf.style.animationDelay = (i * .035) + "s";

        treeContainer.appendChild(leaf);
    }
}

/* Animation sequence */

function schedule(fn, delay) {
    const timer = setTimeout(fn, delay);
    timers.push(timer);
}

function startAnimation() {

    schedule(() => {
        bow.classList.add("shoot-bow");
        arrow.classList.add("fly");
    }, 1000);

    schedule(() => {
        explodeHeart();
    }, 2500);

    schedule(() => {
        message.classList.add("show");
    }, 3100);

    schedule(() => {
        treeContainer.classList.add("show");
        branches.classList.add("draw");
        ground.classList.add("show");
    }, 6500);

    schedule(() => {
        growLeaves();
    }, 9500);
}

/* Replay animation */

function restartAnimation() {

    timers.forEach(clearTimeout);
    timers = [];

    document.querySelectorAll(".particle, .leaf").forEach(el => el.remove());

    heart.style.opacity = "1";
    heart.style.animation = "";

    arrow.classList.remove("fly");
    bow.classList.remove("shoot-bow");

    message.classList.remove("show");

    treeContainer.classList.remove("show");
    branches.classList.remove("draw");
    ground.classList.remove("show");

    // Force animation reset
    void arrow.offsetWidth;
    void message.offsetWidth;
    void branches.offsetWidth;

    startAnimation();
}

/* Initialize */

createStars();
startFloating();
startAnimation();

</script>

</body>
</html>
